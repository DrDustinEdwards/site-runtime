name: ci

# No push to main: the merge was checked as a pull request, and nothing deploys from here (devkit README, "No second run
# on main"). A release is release.yml's.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its base-branch parent, which the changeset step diffs.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # TypeScript and the types the check reads (Workers, Node, Better Auth, the OAuth provider); nothing here runs them.
      - run: npm ci
      # Merging and releasing are two steps (.changeset/README.md): a pull request adds a changeset and leaves the version
      # alone; the release pull request sets the version and uses up every changeset. Renovate's bumps release nothing.
      - name: A changeset, or the release itself
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/')
        run: |
          was=$(git show HEAD^1:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          now=$(node -p 'require("./package.json").version')
          if [ "$was" = "$now" ]; then
            npx changeset status --since=HEAD^1
          else
            left=$(find .changeset -name '*.md' ! -name README.md)
            [ -z "$left" ] || { echo "::error::The version moved from $was to $now, but changesets are left: $left. A release is \`npx changeset version\` on main, alone."; exit 1; }
          fi
      - name: Typecheck the modules and bins against their declarations
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: The rate limiter's windows, refusals and path matcher
        run: npm test
      - name: Every session read goes through sessionLookup
        run: node bin/session-check.mjs .
