name: release

# The release job is devkit's release.yml (tag, release, attested tarball); this file is its caller.
#
# A release is the merge of its version bump, as in Capsomer: when package.json's version on main has no
# v<version> tag yet, this tags that commit, publishes a GitHub release with GitHub's generated notes, and
# starts the consumer bumps. Nobody pushes a tag by hand, and a session that cannot push tags can still
# release by merging.
#
# A tag made with the workflow's own token starts no other workflow (GitHub's rule against loops), so
# bump-consumers is called from here rather than left to its tag trigger. Run it by hand (Actions >
# release > Run workflow) to release a version that merged without a tag.

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: DrDustinEdwards/devkit/.github/workflows/release.yml@e2914d9fdd2b2ef4eb7d393db739c3bb2a808583 # v0.23.0

  bump:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: DrDustinEdwards/devkit/.github/workflows/bump-consumers.yml@e2914d9fdd2b2ef4eb7d393db739c3bb2a808583 # v0.23.0
    with:
      dry_run: false
    secrets:
      token: ${{ secrets.RENOVATE_TRIGGER_TOKEN }}
