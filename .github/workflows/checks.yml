name: checks

# Every pull request check in one job: devkit's pr.yml runs the footer strip, the trailer check, the shared-code check,
# OSV-Scanner, actionlint and zizmor when .github/ changes, the no-bloat ratchet (Knip, jscpd and the test count against
# .no-bloat.json; `npm run bloat` locally) and the reviewer, with one checkout and one install (devkit README, "One job per
# pull request"). Exceptions to the shared-code check are in .shared.json with their reasons. What is shared:
# https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
# Run it by hand once to clean the footer from every past pull request.
#
# No push to main: the merge was checked as a pull request (devkit README, "No second run on main"). The job id is
# `checks`, so the check is "checks / Repo checks", the name the ruleset requires.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# The pull request is the group, so a newer push cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # A called workflow holds no more than this job grants: the footer writes the description, the reviewer signs in to
    # Capsid with the job's OIDC token and writes its check.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr.yml@6da058c1a29d90f321b3b458b4dc76c03d895902 # v0.42.0
    with:
      review: true
      # A library: no Worker of its own.
      worker-size: false
